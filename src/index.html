<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Password Generator</title>
  </head>
  <body>
    <main class="card" aria-label="Password generator">
      <h1 class="sr-only">Password Generator</h1>
      <div class="pw-input-row">
        <div class="pw-input-wrap">
          <span
            class="pw-text"
            id="pw-display"
            aria-label="Generated password"
            aria-live="polite"
          ></span>
          <button
            type="button"
            class="eye-btn"
            title="Toggle visibility"
            aria-label="Hide password"
            aria-pressed="true"
            id="eye-btn"
          >
            <svg
              aria-hidden="true"
              focusable="false"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              id="eye-icon"
            >
              <path
                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
              />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          </button>
        </div>
        <button
          type="button"
          class="dice-btn"
          id="dice-btn"
          title="Generate new password"
          aria-label="Generate new password"
        >
          <svg
            aria-hidden="true"
            focusable="false"
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="2" y="2" width="20" height="20" rx="4" />
            <circle cx="8" cy="8" r="1.2" fill="currentColor" />
            <circle cx="16" cy="8" r="1.2" fill="currentColor" />
            <circle cx="12" cy="12" r="1.2" fill="currentColor" />
            <circle cx="8" cy="16" r="1.2" fill="currentColor" />
            <circle cx="16" cy="16" r="1.2" fill="currentColor" />
          </svg>
        </button>
      </div>

      <div
        class="strength-bar-wrap"
        role="progressbar"
        aria-label="Password strength"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
        id="s-bar-wrap"
      >
        <div class="strength-bar" id="s-bar"></div>
      </div>

      <div class="strength-row">
        <div class="strength-left" id="s-label" aria-live="polite">
          <span class="s-icon" id="s-icon"></span>
          <span id="s-text"></span>
        </div>
        <button
          type="button"
          class="copy-btn"
          id="copy-btn"
          aria-label="Copy password to clipboard"
        >
          <svg
            aria-hidden="true"
            focusable="false"
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="9" y="9" width="13" height="13" rx="2" />
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
          </svg>
          Copy
        </button>
        <span
          class="sr-only"
          id="copy-status"
          role="status"
          aria-live="polite"
        ></span>
      </div>

      <div class="type-row" role="radiogroup" aria-label="Password type">
        <label class="radio-item"
          ><input type="radio" name="pw-type" value="password" checked />
          Password</label
        >
        <label class="radio-item"
          ><input type="radio" name="pw-type" value="passphrase" />
          Passphrase</label
        >
      </div>

      <div class="slider-wrap">
        <input
          type="range"
          id="pw-len"
          min="8"
          max="40"
          value="20"
          step="1"
          aria-label="Password length"
        />
      </div>
      <div class="char-length" id="len-label">Character length: 20</div>

      <div
        class="checkboxes"
        role="group"
        aria-label="Character types"
        id="checkboxes-group"
      >
        <label class="checkbox-item" id="lbl-alpha"
          ><input type="checkbox" id="c-alpha" checked /> A-Z</label
        >
        <label class="checkbox-item" id="lbl-num"
          ><input type="checkbox" id="c-num" checked /> 0-9</label
        >
        <label class="checkbox-item" id="lbl-sym"
          ><input type="checkbox" id="c-sym" checked /> !@#</label
        >
      </div>
      <div class="error-msg" id="error-msg" role="alert"></div>
    </main>
    <noscript>
      <p class="noscript-msg">
        This password generator requires JavaScript to run.
      </p>
    </noscript>
  </body>
</html>
